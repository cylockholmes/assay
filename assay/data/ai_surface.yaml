# Unauthenticated AI/ML infrastructure.
#
# This class barely existed two years ago and is now one of the most reliably
# exposed things on an internal network: Ollama, vLLM, Gradio and the common
# vector databases all ship with no authentication whatsoever, and the usual
# deployment advice tells people to bind them to 0.0.0.0.
#
# Every probe here is a read-only GET or a harmless JSON-RPC introspection.
# Nothing uploads, creates, or infers - the point is to prove reachability and
# say what it costs, not to exercise it.
#
# `match` is required: a port answering is never sufficient, and several of
# these share default ports with each other and with ordinary web apps.
#
# Every path here is a GET unless noted. That matters: a signature pointing at
# a POST-only endpoint can never fire, which is a silent gap rather than a
# visible failure. MLflow's experiments/search is POST-only and was originally
# written here as a GET for exactly that reason.
#
# Because matching is on content rather than port, a wrong port or path costs a
# missed detection - never a false positive.
#
# verified: where the port and path were confirmed against vendor documentation
# or an authoritative source, rather than asserted from memory.

services:

- name: Ollama exposed without authentication
  verified: NVD CVE-2026-7482 + docs.ollama.com/api/tags
  ports: [11434]
  path: /api/tags
  match: '"models"\s*:'
  severity: high
  cwe: CWE-306
  version_path: /api/version
  version_match: '"version"\s*:\s*"([0-9.]+)"'
  vulnerable_below: "0.17.1"
  cve: CVE-2026-7482
  cia: "Confidentiality, Integrity, Availability"
  impact: >
    Ollama has no authentication of any kind, so anyone who can reach the port
    controls it. Confidentiality: the model list and any system prompts are
    readable, and prompts submitted to a RAG-backed model return content from
    the internal corpus behind it. Integrity: models can be pulled, replaced or
    deleted, which silently changes the answers every downstream application
    gives. Availability: inference is free compute for whoever finds it, and a
    single large request will saturate the GPU.
  step: "curl -s http://{host}:{port}/api/tags   # then /api/ps for running models"
  refs:
    - https://github.com/ollama/ollama/blob/main/docs/faq.md

- name: vLLM / OpenAI-compatible inference API exposed
  # /v1/models is defined by the OpenAI API specification that vLLM and the
  # other compatible servers implement, so the path is definitional rather than
  # vendor-specific. The port is the common default, not a guarantee.
  verified: OpenAI API specification (path); default port asserted
  ports: [8000, 8001, 8080, 5000]
  path: /v1/models
  match: '"object"\s*:\s*"list"|"owned_by"'
  severity: high
  cwe: CWE-306
  cia: "Confidentiality, Availability"
  impact: >
    An OpenAI-compatible endpoint with no API key. Anything the served model
    can reach is reachable by the caller: where the deployment fronts a RAG
    pipeline or carries a system prompt, that content is extractable through
    ordinary completions. The compute is also free to whoever finds it, which
    is the mechanism behind current large-scale inference theft.
  step: "curl -s http://{host}:{port}/v1/models"

- name: Gradio application exposed without authentication
  verified: gradio/routes.py @app.get("/config"); default port asserted
  ports: [7860, 7861]
  path: /config
  match: '"mode"\s*:\s*"[^"]*blocks|"is_space"|gradio'
  severity: medium
  cwe: CWE-306
  cia: "Confidentiality, Integrity"
  impact: >
    Gradio serves its full component graph and event API to anonymous callers.
    The config alone reveals what the application does and what it is wired to;
    where a component reads or writes files, those handlers are callable
    directly rather than through the UI.
  step: "curl -s http://{host}:{port}/config | head -c 400"

- name: Qdrant vector database exposed without authentication
  verified: qdrant.tech documentation
  ports: [6333, 6334]
  path: /collections
  match: '"result"\s*:\s*\{[^}]*"collections"'
  severity: high
  cwe: CWE-306
  cia: "Confidentiality, Integrity"
  impact: >
    Vector stores hold the embedded form of whatever corpus was indexed -
    typically internal documents, tickets or source. Confidentiality: stored
    payloads are usually the original text, and embeddings alone can be
    inverted well enough to recover the substance. Integrity: collections are
    writable, so the knowledge base behind every RAG answer can be poisoned or
    deleted without touching the application.
  step: "curl -s http://{host}:{port}/collections"

- name: ChromaDB exposed without authentication
  verified: cookbook.chromadb.dev health checks
  ports: [8000, 8001]
  path: /api/v2/heartbeat
  match: '"nanosecond heartbeat"|"nanosecond_heartbeat"'
  severity: high
  cwe: CWE-306
  cia: "Confidentiality, Integrity"
  impact: >
    ChromaDB ships with no authentication. Collections and their documents are
    readable and writable by anyone who reaches the port, which exposes the
    indexed corpus and allows the retrieval layer to be poisoned.
  step: "curl -s http://{host}:{port}/api/v2/collections"

- name: Weaviate exposed without authentication
  verified: docs.weaviate.io
  ports: [8080, 8081]
  path: /v1/meta
  match: '"hostname"\s*:|"modules"\s*:'
  severity: high
  cwe: CWE-306
  cia: "Confidentiality, Integrity"
  impact: >
    Weaviate's REST and GraphQL interfaces are open. The schema names every
    indexed class, and objects are retrievable and mutable - both a disclosure
    of the corpus and a route to poisoning it.
  step: "curl -s http://{host}:{port}/v1/meta"

- name: Milvus vector database exposed
  # 19530 is confirmed from milvus.yaml (proxy port). The 9091 metrics/health
  # port could not be confirmed from upstream config and is asserted.
  verified: milvus.yaml proxy port 19530; 9091 asserted
  ports: [9091, 19530]
  path: /healthz
  match: 'OK|"state"\s*:'
  severity: medium
  cwe: CWE-306
  cia: "Confidentiality, Integrity"
  impact: >
    Milvus reachable without credentials. Collections can be listed and
    queried, exposing the indexed corpus and allowing insertion of chosen
    vectors into the retrieval path.
  step: "curl -s http://{host}:{port}/healthz"

- name: Ray dashboard exposed without authentication
  verified: docs.ray.io dashboard port
  ports: [8265]
  path: /api/version
  match: '"ray_version"|"version"\s*:'
  severity: critical
  cwe: CWE-306
  cia: "Confidentiality, Integrity, Availability"
  impact: >
    The Ray dashboard accepts job submissions from anyone who can reach it, and
    a job is arbitrary Python on the cluster. This is unauthenticated remote
    code execution with cluster-wide reach, and it has been exploited at scale
    for exactly that. Confirm reachability and stop - do not submit a job.
  step: "curl -s http://{host}:{port}/api/version"

- name: MLflow tracking server exposed without authentication
  verified: mlflow.org REST API reference
  ports: [5000, 5001]
  # experiments/search is POST-only; experiments/get is the GET equivalent and
  # experiment 0 is the Default experiment every server has.
  path: /api/2.0/mlflow/experiments/get?experiment_id=0
  match: '"experiment"\s*:|"experiment_id"\s*:|RESOURCE_DOES_NOT_EXIST'
  severity: high
  cwe: CWE-306
  cia: "Confidentiality, Integrity"
  impact: >
    MLflow has no authentication by default. Experiments, parameters and
    artifacts are readable - artifacts routinely contain training data,
    credentials and notebooks - and the artifact store is writable, which has
    historically been a path to reading arbitrary files from the host.
  step: "curl -s 'http://{host}:{port}/api/2.0/mlflow/experiments/get?experiment_id=0'"

- name: Triton Inference Server exposed
  verified: docs.nvidia.com triton health endpoint
  ports: [8000, 8002]
  path: /v2/health/ready
  match: '^$|"ready"'
  status: [200]
  require_sibling: /v2
  sibling_match: '"name"\s*:\s*"triton"|"extensions"'
  severity: medium
  cwe: CWE-306
  cia: "Confidentiality, Availability"
  impact: >
    Triton exposes its model repository and inference endpoints unauthenticated.
    Model metadata discloses what the organisation runs and on what inputs, and
    the inference endpoint is free compute.
  step: "curl -s http://{host}:{port}/v2"

- name: TorchServe management API exposed
  verified: docs.pytorch.org/serve management_api
  ports: [8081]
  path: /models
  match: '"models"\s*:\s*\['
  severity: critical
  cwe: CWE-306
  cia: "Confidentiality, Integrity, Availability"
  impact: >
    The TorchServe management port registers models from a URL. An
    unauthenticated caller can register a model archive they control, which
    executes their handler code on the server - remote code execution.
    Reachability is the finding; do not register anything.
  step: "curl -s http://{host}:{port}/models"
