# Publishes assay to PyPI as "assay-recon" when a GitHub release is published.
# Uses PyPI trusted publishing (OIDC), so no API token is stored in the repo.
# One-time setup on pypi.org: add a trusted publisher for this repository,
# workflow "python-publish.yml", environment "pypi".

name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("assay/__init__.py").read()).group(1))')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::release tag $TAG does not match assay/__init__.py version $version"
            exit 1
          fi

      - name: Build and verify distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install from wheel and smoke test
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/assay --version
          /tmp/wheel-env/bin/assay modules

      - uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write  # required for trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/assay-recon
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
