name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TESTS_DEPLOY_KEY: ${{ secrets.TESTS_DEPLOY_KEY }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # The test suite lives in a private repo (cylockholmes/assay-tests) and is
      # pulled in with a read-only deploy key. Forks and Dependabot PRs get no
      # secrets, so the step is skipped there rather than failing the run.
      - name: Fetch private test suite
        if: env.TESTS_DEPLOY_KEY != ''
        uses: actions/checkout@v4
        with:
          repository: cylockholmes/assay-tests
          ssh-key: ${{ secrets.TESTS_DEPLOY_KEY }}
          path: tests

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 assay

      - name: Smoke test
        run: |
          assay --version
          assay modules

      - name: Tests
        run: |
          if [ -d tests ]; then
            python -m pytest tests/ -q
          else
            echo "::warning::tests/ not available (no TESTS_DEPLOY_KEY) - skipping"
          fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and verify distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Install from wheel and smoke test
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/assay --version
          /tmp/wheel-env/bin/assay modules
